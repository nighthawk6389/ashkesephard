name: Import Blogger Recipe Archive
on:
  workflow_dispatch:
  schedule:
    - cron: "25 6 * * 1"
permissions:
  contents: write
concurrency:
  group: blogger-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install importer dependencies
        run: python -m pip install beautifulsoup4
      - name: Import all published posts from the Blogger feed
        run: python scripts/import_blogger.py
      - name: Commit updated recipes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/recipes.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync family recipes from Blogger"
            git push
          fi
